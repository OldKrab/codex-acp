name: Upstream Sync

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: agentclientprotocol/codex-acp

jobs:
  open-update:
    name: Open an upstream release PR
    runs-on: ubuntu-latest
    steps:
      - name: Generate repository token
        id: repository-token
        # Match the other release workflows: the shared App installation owns
        # its permission policy, and rejects a separately narrowed token request.
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # App-authored pull requests trigger the ordinary pull_request CI workflow.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.repository-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Find the latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected upstream release tag: $tag" >&2
            exit 1
          fi

          branch="shushakov/sync-upstream-${tag}"
          tracked="$(jq -r '.openaideUpstream // empty' package.json)"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          if [[ "$tracked" == "${UPSTREAM_REPOSITORY}@${tag}" ]]; then
            echo "The fork already records ${UPSTREAM_REPOSITORY}@${tag}"
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch only the immutable release tag. The namespaced ref cannot
          # collide with the fork's independent release tags.
          git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" \
            "refs/tags/${tag}:refs/upstream-releases/${tag}"
          commit="$(git rev-parse "refs/upstream-releases/${tag}^{commit}")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$commit" HEAD; then
            echo "Upstream ${tag} is already in the fork history"
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "required=true" >> "$GITHUB_OUTPUT"

      - name: Publish the release branch
        if: steps.release.outputs.required == 'true'
        id: publish-branch
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          remote_commit="$(git ls-remote --heads origin "refs/heads/${BRANCH}" | cut -f1)"
          if [[ -z "$remote_commit" || "$remote_commit" == "$RELEASE_COMMIT" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            node scripts/prepare-upstream-sync.mjs \
              --release "$RELEASE_COMMIT" \
              --tag "$TAG" \
              --branch "$BRANCH"
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi

          existing_pr="$(gh pr list \
            --head "$BRANCH" \
            --state all \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "Pull request #${existing_pr} already tracks this release"
            echo "create_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "create_pr=true" >> "$GITHUB_OUTPUT"

      - name: Open the update pull request
        if: steps.publish-branch.outputs.create_pr == 'true'
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          cat > "$body" <<EOF
          Tracks the exact [upstream ${TAG} release](https://github.com/${UPSTREAM_REPOSITORY}/releases/tag/${TAG}).

          This branch merges the immutable upstream release into the fork. The sync workflow preserves the \`@openaide/codex-acp\` package identity, independent release configuration, and fork-owned publishing workflow while importing upstream package and product changes.

          The normal pull-request CI suite validates the prepared merge.
          EOF

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync upstream ${TAG}" \
            --body-file "$body"
